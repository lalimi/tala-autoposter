name: tala post cron

# Fires every 30 min (off the congested top-of-hour, which GitHub delays/drops).
# The endpoint SELF-THROTTLES: it only posts if the last post is older than
# TALA_MIN_GAP_MINUTES (~2h), so a dropped/late run is caught by the next one
# instead of leaving a gap. (Vercel Hobby crons only fire daily, hence GitHub.)
# GitHub disables schedules after 60 days of repo inactivity.
on:
  schedule:
    - cron: "8,38 * * * *"   # :08 and :38 every hour, UTC
  workflow_dispatch: {}       # manual "Run workflow" button

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/cron
        env:
          VERCEL_CRON_URL: ${{ secrets.VERCEL_CRON_URL }}   # https://<app>.vercel.app/api/cron
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$VERCEL_CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n"
