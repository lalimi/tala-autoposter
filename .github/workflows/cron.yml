name: tala post cron

# Triggers the Vercel post endpoint every 2 hours. (Vercel Hobby crons only fire
# once a day, so the real cadence lives here.) GitHub may delay scheduled runs
# under load, and disables schedules after 60 days of repo inactivity.
on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours, UTC
  workflow_dispatch: {}      # manual "Run workflow" button

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/cron
        env:
          VERCEL_CRON_URL: ${{ secrets.VERCEL_CRON_URL }}   # https://<app>.vercel.app/api/cron
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$VERCEL_CRON_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n"
