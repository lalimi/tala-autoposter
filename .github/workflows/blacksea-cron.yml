name: blacksea post cron

# Fires every 30 min during the daytime window (06-19 UTC ≈ 09:00-22:00 Kyiv).
# The endpoint SELF-THROTTLES via BLACKSEA_MIN_GAP_MINUTES (~3.5h), so this
# yields ~3-4 evenly spread posts/day and a dropped/late GitHub run is simply
# caught by the next 30-min slot. (Vercel Hobby crons only fire daily.)
# GitHub disables schedules after 60 days of repo inactivity.
on:
  schedule:
    - cron: "8,38 6-19 * * *"   # every 30 min, 06:00-19:38 UTC
  workflow_dispatch: {}          # manual "Run workflow" button

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel /api/blacksea
        env:
          # Reuse Tala's URL secret — same Vercel project/domain, just a
          # different route. No extra secret to manage.
          VERCEL_CRON_URL: ${{ secrets.VERCEL_CRON_URL }}   # https://<app>.vercel.app/api/cron
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BLACKSEA_URL="${VERCEL_CRON_URL%/api/cron}/api/blacksea"
          echo "POST $BLACKSEA_URL"
          curl -fsS -X POST "$BLACKSEA_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -w "\nHTTP %{http_code}\n"
